name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./... -count=1 -timeout=90s

      - name: Fuzz bencode
        run: |
          go test ./internal/bencode -run='^$' -fuzz='^FuzzDecode$' -fuzztime=10s -parallel=2 -timeout=60s
          go test ./internal/bencode -run='^$' -fuzz='^FuzzDecodeNestedValues$' -fuzztime=10s -parallel=2 -timeout=60s
